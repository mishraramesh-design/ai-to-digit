name: Build and publish workbench
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: mishramesh/ai-to-digit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Build and smoke test
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^[a-z0-9_-]+/[a-z0-9._-]+$ ]]
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm --detach --name workbench -p 127.0.0.1:8090:8090 "$IMAGE:$GITHUB_SHA"
          trap 'docker logs workbench; docker stop workbench' EXIT
          curl --retry 10 --retry-connrefused --fail --silent http://127.0.0.1:8090/api/knowledge > /dev/null
          curl --fail --silent http://127.0.0.1:8090/api/runs \
            -H 'Content-Type: application/json' \
            -d '{"requirement":"Add missed pickups","kind":"complaint-subtype","code":"MISSED_PICKUP","label":"Missed pickup"}' |
            python -c 'import json, sys; from uuid import UUID; run = json.load(sys.stdin); UUID(run["run_id"]); assert run["decision"]["path"] == "configure" and len(run["tests"]) == 3 and all(t["pass"] for t in run["tests"])'
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push commit-tagged image
        run: docker push "$IMAGE:$GITHUB_SHA"
